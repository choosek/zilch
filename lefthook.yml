# Pin how the generated git hooks invoke lefthook. Without this, the hook
# scripts in .git/hooks walk a package-manager probe ladder (yarn, pnpm, bun, …)
# and, when the local binary is not found first, fall through to `pnpm lefthook`,
# which drops a stray pnpm-lock.yaml into this npm project. Forcing `npx lefthook`
# resolves the local node_modules/.bin/lefthook and never touches pnpm.
lefthook: npx lefthook

pre-commit:
  commands:
    biome-format:
      glob: "*.{ts,json,jsonc}"
      run: npx biome format --write --no-errors-on-unmatched --files-ignore-unknown=true --colors=off {staged_files}
      stage_fixed: true

commit-msg:
  commands:
    lint-commit-msg:
      run: npx commitlint --edit

pre-push:
  commands:
    biome-check:
      glob: "*.{ts,json,jsonc}"
      run: npx biome check --no-errors-on-unmatched --files-ignore-unknown=true --colors=off {push_files}
    tsc-check:
      glob: "*.{ts}"
      run: npx tsc
    test:
      glob: "*.{ts}"
      run: npm test
